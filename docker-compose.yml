services:
    app:
        image: ghcr.io/jubstaaa/waqt-api:latest
        container_name: waqt-api
        restart: unless-stopped
        mem_limit: 128m
        healthcheck:
            test:
                [
                    'CMD',
                    'bun',
                    '-e',
                    "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        environment:
            MEDIA_BASE_URL: https://waqt.fra1.cdn.digitaloceanspaces.com
        ports:
            - '127.0.0.1:3014:3000'
        volumes:
            - /opt/waqt-api/data:/data:ro
